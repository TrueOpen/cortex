syntax = "proto3";

package cortex.v1;

option go_package = "github.com/TrueOpen/cortex/proto/cortex/v1;cortexv1";

// NOTE (current implementation): the chat capability NO LONGER delivers this
// ChatCompletion object. The committed/delivered output is now the RAW TEXT decoded
// from the committed token_ids -- each generated token's bytes
// (logprobs.content[i].bytes) concatenated in order, including the trailing EOS
// special token -- exactly like the raw-text (inferV0) path, so the delivered text,
// the streamed chunk text, trace.Output and checkpoint.Output all correspond
// byte-for-byte to the token_ids the Verifier scores. tool_calls are not parsed out
// separately; any tool-call syntax the model emitted is just tokens in that raw
// text. This message is retained for reference only and is no longer the delivered
// shape (no Go code constructs or parses it).
//
// ChatCompletionOutput was the committed output the chat capability delivered: a
// clean OpenAI Chat Completions RESPONSE object (verified against openai-python
// v1.107.3).
//
// It carries only the fields an OpenAI ChatCompletion requires to validate
// (id, object, created, model, choices) plus usage (commonly read for metering).
// Every vLLM-internal field is deliberately EXCLUDED -- token_ids, logprobs and
// especially prompt_token_ids are evidence material, not user output, and the
// last would leak the chat-template-expanded input tokens.
//
// finish_reason here is the FAITHFUL model value ("tool_calls", "stop", ...) --
// distinct from the in-set FinishReasonV1 the worker-value commitment binds
// (where "tool_calls" maps to EOS). The two serve different purposes.
message ChatCompletionOutput {
  // id is a unique id for the completion (passed through from the engine).
  string id = 1;
  // object is always "chat.completion".
  string object = 2;
  // created is the Unix timestamp (seconds) of when the completion was produced.
  int64 created = 3;
  // model is the chain model_id the task ran under (protocol identity).
  string model = 4;
  repeated ChatCompletionOutputChoice choices = 5;
  // usage is optional but recommended; clients read it for metering.
  ChatCompletionOutputUsage usage = 6;
}

message ChatCompletionOutputChoice {
  int32 index = 1;
  ChatCompletionOutputMessage message = 2;
  // finish_reason is the faithful model value: "stop" | "length" | "tool_calls"
  // | "content_filter" | "function_call".
  string finish_reason = 3;
}

message ChatCompletionOutputMessage {
  // role is always "assistant".
  string role = 1;
  // content is the assistant text; empty when the turn only carried tool_calls.
  string content = 2;
  repeated OutputToolCall tool_calls = 3;
}

message OutputToolCall {
  string id = 1;
  // type is "function".
  string type = 2;
  OutputFunctionCall function = 3;
}

message OutputFunctionCall {
  string name = 1;
  // arguments is the model-generated arguments as a JSON string (OpenAI wire
  // shape); it may not be valid JSON and must be validated before use.
  string arguments = 2;
}

message ChatCompletionOutputUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}
