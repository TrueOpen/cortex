mode: real
chain_id: trueopen-devnet-1
admin:
  uds_path: /tmp/cortex-verifier.sock
model_management:
  transport: fake
node:
  rpc_endpoint: http://127.0.0.1:26657
  rest_endpoint: http://127.0.0.1:1317
  # With https:// endpoints to a node with a self-signed certificate, add one of
  # (see configs/real.example.yaml):
  # tls:
  #   ca_file: /etc/cortex/node-ca.pem
  #   pubkey_hash: "<64 lowercase hex>"
keeper:
  poll_interval_ms: 1000
  max_lag_blocks: 20
task_execution:
  retry_delay_ms: 1000
  # fake model transport: input comes from the shared local fixture root, not
  # from Nexus. Real deployments use `nexus`.
  input_resolver: fixture
  fixture_root: /tmp/cortex-integration-fixtures
nexus:
  ingress_url: http://127.0.0.1:8080
  auth_token_file: /tmp/cortex-integration/nexus.token
tx:
  enabled: true
  max_fee_amount: 1000000
  fee_denom: uusdc
  max_attempts: 5
  poll_attempts: 30
  gas_limit: 250000
artifacts:
  root: /tmp/cortex-integration/verifier-evidence
store:
  path: /tmp/cortex-integration/verifier-store
signer:
  uri: http://127.0.0.1:9082
local_identity:
  operator_address: trueopen1verifieroperator
  service_key_ref: verifier-service
  # model_id is the chain Hash32 model id as 64 lowercase hex; list the models
  # registered for a repository with `cortexctl model find --rpc URL --repo ID`.
  supported_model_profiles: [c2e5065e9dda862ec6970d2c54765ad9414f22fe7ae82cf94dae6825828129c1@1=llm_text_v1]
  model_service_id: fake-model-service
self_rescue:
  enabled: false
challenge_verifier:
  enabled: false
health:
  bind: 127.0.0.1:8083
