mode: real
chain_id: trueopen-devnet-1
admin:
  uds_path: /tmp/cortex-worker.sock
model_management:
  transport: fake
node:
  rpc_endpoint: http://127.0.0.1:26657
  rest_endpoint: http://127.0.0.1:1317
keeper:
  poll_interval_ms: 1000
  max_lag_blocks: 20
task_execution:
  retry_delay_ms: 1000
  # fake model transport: input comes from the shared local fixture root, not
  # from Nexus. Worker output still uses SubmitInferReceipt followed by
  # UploadTaskResultData with current Cortex service-key authentication.
  input_resolver: fixture
  fixture_root: /tmp/cortex-integration-fixtures
nexus:
  ingress_url: http://127.0.0.1:8080
  nats_url: nats://127.0.0.1:4222
  # Seed file of this node's NATS user key (ed25519 nkey, generated on first
  # start). Real mode requires it for a remote NATS; nats_creds_file is
  # retired and refused in real mode (ADR-0016 P5).
  nats_user_key_file: /tmp/cortex-integration/worker-nats-user.nk
  auth_token_file: /tmp/cortex-integration/nexus.token
  # JetStream stream Nexus publishes task frames to; devnet ships TRUEOPEN_TASK.
  jetstream_stream: TRUEOPEN_TASK
  # Integration shape stays strict like production. trusted_nats_dev is unsafe
  # and rejected in real mode.
  envelope_auth_mode: strict
  # TTL stamped on outbound envelopes and the maximum accepted lifetime of an
  # inbound one; must match the Nexus this node talks to.
  envelope_ttl_ms: 30000
  # Tolerated clock skew when judging inbound issued_at/expires_at.
  envelope_clock_skew_ms: 2000
  subscribe_models: [llama-dev]
tx:
  enabled: true
  max_fee_amount: 1000000
  fee_denom: uusdc
  max_attempts: 5
  poll_attempts: 30
  gas_limit: 250000
artifacts:
  root: /tmp/cortex-integration/worker-evidence
store:
  path: /tmp/cortex-integration/worker-store
signer:
  uri: http://127.0.0.1:9081
local_identity:
  operator_address: trueopen1workeroperator
  service_key_ref: worker-service
  supported_model_profiles: [llama-dev@1=llm_text_v1]
  model_service_id: fake-model-service
self_rescue:
  enabled: false
challenge_verifier:
  enabled: false
health:
  bind: 127.0.0.1:8082
