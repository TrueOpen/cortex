mode: real
chain_id: trueopen-devnet-1
admin:
  uds_path: /tmp/cortexd.sock
model_management:
  endpoint: 127.0.0.1:9090
  transport: grpc
  max_concurrency: 1
node:
  rpc_endpoint: http://127.0.0.1:26657
  rest_endpoint: http://127.0.0.1:1317
  # With https:// endpoints to a node with a self-signed certificate, add one of
  # (see configs/real.example.yaml):
  # tls:
  #   ca_file: /etc/cortex/node-ca.pem
  #   pubkey_hash: "<64 lowercase hex>"
keeper:
  poll_interval_ms: 1000
  max_lag_blocks: 20
task_execution:
  retry_delay_ms: 30000
  # grpc model transport: task input comes from the receiving Builder's Nexus.
  input_resolver: nexus
nexus:
  ingress_url: https://nexus.devnet.trueopen.xyz
  auth_token_file: /etc/cortex/nexus.token
tx:
  enabled: true
  max_fee_amount: 1000000
  fee_denom: uusdc
  max_attempts: 5
  poll_attempts: 30
  gas_limit: 250000
artifacts:
  root: /var/lib/cortex/evidence
store:
  path: /var/lib/cortex/store
signer:
  uri: http://127.0.0.1:9080
local_identity:
  operator_address: trueopen1operator
  service_key_ref: kms://cortex/service-key
  # model_id is the chain Hash32 model id as 64 lowercase hex; list the models
  # registered for a repository with `cortexctl model find --rpc URL --repo ID`.
  supported_model_profiles: [c2e5065e9dda862ec6970d2c54765ad9414f22fe7ae82cf94dae6825828129c1@1=llm_text_v1]
  model_service_id: model-service-devnet
self_rescue:
  enabled: false
challenge_verifier:
  enabled: false
# Phase 1 direct dispatch (ADR-0038; cortex 详细设计 §4.2.0, §15). Real mode
# refuses to start without it. Nothing here names an address: each Builder's
# endpoint and TLS pin come from its on-chain service descriptor only.
dispatch:
  # Builder operators this node keeps a standing handraise and one stream
  # with. At least one. Replace this placeholder with a BuilderSet member.
  builders: [trueopen1crqu9s7ychrv0jxfet9uenwwelgdr5knutsmxe]
  # To remove a Builder, move it here and restart: the node withdraws (zero
  # free slots), refuses its new tickets, waits for its accepted ones to
  # finish, then closes the stream. Delete it once diagnostics say "retired".
  retiring_builders: []
  # 参数表 values every Builder shares; no built-in defaults.
  evidence_retention_blocks: 201600
  handraise:
    heartbeat_ms: 10000
    ttl_ms: 30000
    min_change_interval_ms: 500
  # Local floor per profile, "<model_id>@<profile_version>"; real mode needs
  # one above zero for every supported profile.
  min_price_bid:
    "c2e5065e9dda862ec6970d2c54765ad9414f22fe7ae82cf94dae6825828129c1@1": 1000
  stream:
    # Deployment settings, no defaults. A Builder must tolerate at least two
    # missed probes: one Handler may hold the stream for handler_timeout_ms.
    keepalive_ms: 15000
    max_missed: 3
  receipt_rescue_margin_blocks: 5
  omission:
    roster_grace_blocks: 20
    challenge_margin_blocks: 5
health:
  bind: 127.0.0.1:8081
